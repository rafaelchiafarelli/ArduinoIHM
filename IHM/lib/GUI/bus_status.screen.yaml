      - { kind: label, id: rs485_label, text: "RS485", font_size: medium, size: { w: 60, h: 18 } }
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: rs485_length, text: "LEN %d", bind: { message: bus_status, field: rs485_length, type: int }, on_press: edit_rs485_length, font_size: medium, size: { w: 66, h: 18 } }

  - kind: row
    id: rs485_row2
    align: center
    children:
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: rs485_period_ms, text: "%dms", bind: { message: bus_status, field: rs485_period_ms, type: int64 }, on_press: edit_rs485_period, font_size: medium, size: { w: 77, h: 18 } }
      - kind: row
