# SERIAL tab -- the CAN0/CAN1/RS-485 signal-generator settings
# (initiative serial_config; model: lib/BusConfig/src/SerialConfig.h).
# Edited on the board with the knobs and from the PC (CAN_SIGNAL_CONFIG /
# RS485_SIGNAL_CONFIG), last writer wins; main.cpp's mirrorSerialToUi()
# is the only writer of the bound fields.
#
# font_size (2026-09-05, see runtime/embedded_c/include/janus_font.h):
# every label here renders at `medium` (10x14, ~11px/char incl. padding).
#
# ROW RULE (serial_config question 1, Rafael 2026-09-27) -- bus
# initiatives adding a setting follow it (lib/BusConfig/README.md):
#   * same logic as the PWM tab: every value is its own field, wrapped in
#     a `focus_ring: true` row with an `on_press` action so RE1 can focus
#     it; RE2 changes the focused field (main.cpp); no press needed.
#     Switches (`toggle`) are set by RE2 (CW = on), flipped by pbRE1.
#   * two rows per bus, `align: center`, each at most 320 px. Each
#     focus_ring wrapper adds 12 px (6 px ring pad per side) and each
#     gap between children 4 px, so size labels tight (11 px per char):
#       row 1: enable switch, bus name, "ID <hex>" + "DLC <n>" (CAN) /
#              "LEN <n>" (RS-485)
#       row 2: "EXT<0|1>" (CAN), "<n>ms" period, "x<n>" / "x inf" repeat,
#              byte index "B<n>", that byte's value "=<hex>" -- the index
#              picks which data byte the value field edits.
#     Row 1 has 13 px left on CAN and ~150 px on RS-485 for a bus
#     initiative's own fields; more than that gets a third row.
#   * a row that changes with a bus mode (e.g. RS-485 in Modbus mode) is
#     the owning initiative's to design.
#   * values past 32767 bind as `int64` (AVR `int` is 16-bit): the CAN ID
#     and the period. Texts that aren't a plain number (repeat "x inf")
#     are `string` fields formatted in main.cpp.
screen: BusStatus
layout: column
children:
  - kind: row
    id: can0_row
    align: center
    children:
      - kind: row
        focus_ring: true   # toggles draw no ring of their own; this row carries it
        children:
          - { kind: toggle, id: can0_enabled_toggle, bind: { message: bus_status, field: can0_enabled, type: int }, on_press: toggle_can0_enabled, size: { w: 28, h: 18 }, bg: "#D0D0D0", color: "#D0D0D0", knob_off: "#FF0000", knob_on: "#00FF00" }
      - { kind: label, id: can0_label, text: "CAN0", font_size: medium, size: { w: 44, h: 18 } }
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can0_id, text: "ID %x", bind: { message: bus_status, field: can0_id, type: int64 }, on_press: edit_can0_id, font_size: medium, size: { w: 121, h: 18 } }
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can0_dlc, text: "DLC %d", bind: { message: bus_status, field: can0_dlc, type: int }, on_press: edit_can0_dlc, font_size: medium, size: { w: 66, h: 18 } }

  - kind: row
    id: can0_row2
    align: center
    children:
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can0_extended, text: "EXT%d", bind: { message: bus_status, field: can0_extended, type: int }, on_press: edit_can0_extended, font_size: medium, size: { w: 44, h: 18 } }
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can0_period_ms, text: "%dms", bind: { message: bus_status, field: can0_period_ms, type: int64 }, on_press: edit_can0_period, font_size: medium, size: { w: 77, h: 18 } }
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can0_repeat, text: "%s", bind: { message: bus_status, field: can0_repeat_label, type: string }, on_press: edit_can0_repeat, font_size: medium, size: { w: 66, h: 18 } }
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can0_byte_index, text: "B%d", bind: { message: bus_status, field: can0_byte_index, type: int }, on_press: edit_can0_byte_index, font_size: medium, size: { w: 22, h: 18 } }
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can0_byte_value, text: "=%x", bind: { message: bus_status, field: can0_byte_value, type: int }, on_press: edit_can0_byte_value, font_size: medium, size: { w: 33, h: 18 } }

  - kind: row
    id: can1_row
    align: center
    children:
      - kind: row
        focus_ring: true   # toggles draw no ring of their own; this row carries it
