      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can1_dlc, text: "DLC %d", bind: { message: bus_status, field: can1_dlc, type: int }, on_press: edit_can1_dlc, font_size: medium, size: { w: 66, h: 18 } }

  - kind: row
    id: can1_row2
    align: center
    children:
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can1_extended, text: "EXT%d", bind: { message: bus_status, field: can1_extended, type: int }, on_press: edit_can1_extended, font_size: medium, size: { w: 44, h: 18 } }
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can1_period_ms, text: "%dms", bind: { message: bus_status, field: can1_period_ms, type: int64 }, on_press: edit_can1_period, font_size: medium, size: { w: 77, h: 18 } }
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can1_repeat, text: "%s", bind: { message: bus_status, field: can1_repeat_label, type: string }, on_press: edit_can1_repeat, font_size: medium, size: { w: 66, h: 18 } }
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can1_byte_index, text: "B%d", bind: { message: bus_status, field: can1_byte_index, type: int }, on_press: edit_can1_byte_index, font_size: medium, size: { w: 22, h: 18 } }
      - kind: row
        focus_ring: true
        children:
          - { kind: label, id: can1_byte_value, text: "=%x", bind: { message: bus_status, field: can1_byte_value, type: int }, on_press: edit_can1_byte_value, font_size: medium, size: { w: 33, h: 18 } }

  - kind: row
    id: rs485_row
    align: center
    children:
      - kind: row
        focus_ring: true   # toggles draw no ring of their own; this row carries it
        children:
