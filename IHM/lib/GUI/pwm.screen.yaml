          - kind: row
            children:
              - kind: row
                focus_ring: true
                children:
                  - { kind: toggle, id: pwm_ch3_b_enabled_toggle, bind: { message: pwm, field: ch3_b_enabled, type: int }, on_press: toggle_pwm_ch3_b_enabled, size: { w: 28, h: 18 }, bg: "#D0D0D0", color: "#D0D0D0", knob_off: "#FF0000", knob_on: "#00FF00" }
              - { kind: label, id: pwm_ch3_b_label, text: "B", font_size: medium, size: { w: 18, h: 18 } }
              - kind: row
                focus_ring: true   # duty: RE1 selects it, RE2 changes it 1 % per detent
                children:
                  - { kind: progress, id: pwm_ch3_b_duty, bind: { message: pwm, field: ch3_b_duty_percent, type: int }, range: { min: 0, max: 100 }, on_press: edit_pwm_ch3_b_duty, size: { w: 90, h: 14 } }
          - kind: row
