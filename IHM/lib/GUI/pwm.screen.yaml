# PWM tab -- 2 simplex channels (CH0/Timer3/OC3A, CH1/Timer5/OC5A) and
# 2 complex channels (CH2/Timer1/OC1A,B,C, CH3/Timer4/OC4A,B,C).
#
# Row layout (redesigned 2026-09-06): each channel is a plain `row` in the
# screen's ROOT column -- the collapsible box/summary drawer is gone. A row
# holds a left `column` (state / frequency / duty / enable+invert
# controls, stacked) and, to its right, a single `image` icon sized to the
# row's full height. No per-channel/per-output LEDs (removed 2026-09-27,
# fixes/00000c): each one only repeated the Enabled switch beside it.
#   * CH0 / CH1 left column (2026-09-25): live frequency label, the
#     duty bar under it, then a read-only "inverted" / "non-inverted" label
#     (string-bound `chN_inverting_label`, filled by main.cpp). The
#     Enabled and Inverting switches sit unlabeled right of the frequency,
#     mainly so the row has something focusable.
#   * CH0 / CH1 -- the two "small" rows. The left column's content is ~62px
#     and the icon is 80x80, so each row is 80px tall (row height = tallest
#     child) and equal to the other.
#   * CH2 / CH3 -- the two "big" rows. `fill: true`, so after status_bar,
#     tab_bar and the two small rows take their heights, the ~252px left
#     over on the 320x480 panel is split evenly -> 126px each. The icon is
#     126x126 to match that exact row height (retune if the panel size or
#     the fixed rows above change).
#
# Icons: `file:` icons sit next to this .yaml in lib/GUI and are baked to
# RGB565 PROGMEM at generation time (rescaled to the widget size, no aspect
# lock -- square source art renders truer). Static pick for now:
# `variable_single` for the simplex channels, `variable_multiple` for the
# complex ones. The `*_disabled.jpg` art is already in lib/GUI for a future
# Janus `hidden`/state flag to select enabled vs disabled from the bound
# enable bit.
#
# Frequency editing (fixes/000006, 2026-09-26): each channel's frequency
# label sits in its own focus_ring row with `on_press:
# cycle_pwm_chN_frequency`, which makes it focusable. With it focused, RE2
# steps the frequency live (CW = higher, clamped at 62500 Hz / 15 Hz), and
# pbRE1 cycles it one step lower, wrapping (main.cpp / janus_actions.cpp).
# Only the 13 fixed frequencies are reachable here.
#
# Duty editing (navigation value_editing/2, 2026-09-26): every duty bar sits
# in its own focus_ring row with `on_press: edit_pwm_*_duty` (a no-op press;
# it only makes the bar focusable). With it focused, RE2 changes the duty
# 1 % per detent, live, clamped 0-100. On CH2/CH3 each A/B/C line has two
# rings (switch, bar) so the ring shows exactly what RE2 will change.
#
# `top` (the timer's variable-TOP register) stays dropped -- no v1 widget
# edits a raw numeric value. The frequency is shown inside the string-bound
# `chN_state_label` (main.cpp's formatFrequencyLabel fills it). The old
# static `pwm_chN_freq` placeholder labels were removed 2026-09-25: they sat
# next to the live label and showed a fixed, wrong value.
#
# font_size: every in-row label renders at `medium` (10x14).
# CH0/CH1 (fixes/00000a, 2026-09-27): the frequency label is 110 px (11
# characters, enough for "F:8000000Hz" at VARIABLE's 8 MHz), and a static
# "Duty:" caption sits in front of the duty bar. CH2/CH3 are unchanged.
# The PWM/SERIAL/Output tab switcher is Janus's own generated nav strip
# (app.yaml's `nav: { kind: tabs }`) -- no hand-authored tab_bar row here
# any more; a manual one used to duplicate it before that strip existed.
# Likewise the status text is app.yaml's `status: { text: ... }` chrome
# (status_bar epic) now, not a per-screen row -- the old per-screen
# status_bar here used to duplicate identical placeholder text across all
# three screens, which is exactly what caused relay.screen.yaml's
# duplicate-children-key bug.
screen: PWM
layout: column
children:
  # ---- CH0 -- small row (80px). Controls left, full-height icon right ---
  - kind: row
    id: pwm_ch0_row
    children:
      - { kind: image, id: pwm_ch0_icon, file: "variable_single.jpg", size: { w: 80, h: 80 } }
      - { kind: image, id: pwm_ch0_icon, file: "variable_single_disabled.jpg", hidden: true, size: { w: 80, h: 80 } }
      - kind: column
        id: pwm_ch0_left
        children:
          - kind: row
            children:
              - kind: row
                focus_ring: true   # frequency: RE1 focuses it, RE2 steps it, pbRE1 cycles it
                children:
                  - { kind: label, id: pwm_ch0_state, bind: { message: pwm, field: ch0_state_label, type: string }, on_press: cycle_pwm_ch0_frequency, font_size: medium, size: { w: 110, h: 18 } }
              - kind: row
                focus_ring: true   # toggles draw no ring of their own; this row carries it
                children:
                  - { kind: toggle, id: pwm_ch0_enabled_toggle, bind: { message: pwm, field: ch0_enabled, type: int }, on_press: toggle_pwm_ch0_enabled, size: { w: 28, h: 18 }, bg: "#D0D0D0", color: "#D0D0D0", knob_off: "#FF0000", knob_on: "#00FF00" }
              - kind: row
                focus_ring: true   # toggles draw no ring of their own; this row carries it
                children:
                  - { kind: toggle, id: pwm_ch0_inverting_toggle, bind: { message: pwm, field: ch0_inverting, type: int }, on_press: toggle_pwm_ch0_inverting, size: { w: 28, h: 18 }, bg: "#D0D0D0", color: "#D0D0D0", knob_off: "#FF0000", knob_on: "#00FF00" }
          - kind: row
            children:
              - { kind: label, id: pwm_ch0_duty_caption, text: "Duty:", font_size: medium, size: { w: 50, h: 18 } }
              - kind: row
                focus_ring: true   # duty: RE1 selects it, RE2 changes it 1 % per detent
                children:
                  - { kind: progress, id: pwm_ch0_duty, bind: { message: pwm, field: ch0_duty_percent, type: int }, range: { min: 0, max: 100 }, on_press: edit_pwm_ch0_duty, size: { w: 110, h: 14 } }
          - { kind: label, id: pwm_ch0_inverting, bind: { message: pwm, field: ch0_inverting_label, type: string }, font_size: medium, size: { w: 130, h: 18 } }
      

  # ---- CH1 -- small row (80px) ----------------------------------------
  - kind: row
    id: pwm_ch1_row
    children:
      - { kind: image, id: pwm_ch1_icon, file: "variable_single.jpg", size: { w: 80, h: 80 } }
      - { kind: image, id: pwm_ch1_icon, file: "variable_single_disabled.jpg", hidden: true, size: { w: 80, h: 80 } }
      - kind: column
        id: pwm_ch1_left
        children:
          - kind: row
            children:
              - kind: row
                focus_ring: true   # frequency: RE1 focuses it, RE2 steps it, pbRE1 cycles it
                children:
                  - { kind: label, id: pwm_ch1_state, bind: { message: pwm, field: ch1_state_label, type: string }, on_press: cycle_pwm_ch1_frequency, font_size: medium, size: { w: 110, h: 18 } }
              - kind: row
                focus_ring: true   # toggles draw no ring of their own; this row carries it
                children:
                  - { kind: toggle, id: pwm_ch1_enabled_toggle, bind: { message: pwm, field: ch1_enabled, type: int }, on_press: toggle_pwm_ch1_enabled, size: { w: 28, h: 18 }, bg: "#D0D0D0", color: "#D0D0D0", knob_off: "#FF0000", knob_on: "#00FF00" }
              - kind: row
                focus_ring: true   # toggles draw no ring of their own; this row carries it
                children:
                  - { kind: toggle, id: pwm_ch1_inverting_toggle, bind: { message: pwm, field: ch1_inverting, type: int }, on_press: toggle_pwm_ch1_inverting, size: { w: 28, h: 18 }, bg: "#D0D0D0", color: "#D0D0D0", knob_off: "#FF0000", knob_on: "#00FF00" }
          - kind: row
            children:
              - { kind: label, id: pwm_ch1_duty_caption, text: "Duty:", font_size: medium, size: { w: 50, h: 18 } }
              - kind: row
                focus_ring: true   # duty: RE1 selects it, RE2 changes it 1 % per detent
                children:
                  - { kind: progress, id: pwm_ch1_duty, bind: { message: pwm, field: ch1_duty_percent, type: int }, range: { min: 0, max: 100 }, on_press: edit_pwm_ch1_duty, size: { w: 110, h: 14 } }
          - { kind: label, id: pwm_ch1_inverting, bind: { message: pwm, field: ch1_inverting_label, type: string }, font_size: medium, size: { w: 130, h: 18 } }
      

  # ---- CH2 -- big row (fill -> 126px). Icon 126x126 matches row height -
  - kind: row
    id: pwm_ch2_row
    fill: true
    children:
      - { kind: image, id: pwm_ch2_icon, file: "variable_multiple.jpg", size: { w: 126, h: 126 } }
      - { kind: image, id: pwm_ch2_icon, file: "variable_multiple_disabled.jpg", hidden: true, size: { w: 126, h: 126 }  }
      - kind: column
        id: pwm_ch2_left
        children:
          - kind: row
            children:
              - kind: row
                focus_ring: true   # frequency: RE1 focuses it, RE2 steps it, pbRE1 cycles it
                children:
                  - { kind: label, id: pwm_ch2_state, bind: { message: pwm, field: ch2_state_label, type: string }, on_press: cycle_pwm_ch2_frequency, font_size: medium, size: { w: 90, h: 18 } }
          - kind: row
            children:
              - kind: row
                focus_ring: true
                children:
                  - { kind: toggle, id: pwm_ch2_a_enabled_toggle, bind: { message: pwm, field: ch2_a_enabled, type: int }, on_press: toggle_pwm_ch2_a_enabled, size: { w: 28, h: 18 }, bg: "#D0D0D0", color: "#D0D0D0", knob_off: "#FF0000", knob_on: "#00FF00" }
              - { kind: label, id: pwm_ch2_a_label, text: "A", font_size: medium, size: { w: 18, h: 18 } }
              - kind: row
                focus_ring: true   # duty: RE1 selects it, RE2 changes it 1 % per detent
                children:
                  - { kind: progress, id: pwm_ch2_a_duty, bind: { message: pwm, field: ch2_a_duty_percent, type: int }, range: { min: 0, max: 100 }, on_press: edit_pwm_ch2_a_duty, size: { w: 90, h: 14 } }
          - kind: row
            children:
              - kind: row
                focus_ring: true
                children:
                  - { kind: toggle, id: pwm_ch2_b_enabled_toggle, bind: { message: pwm, field: ch2_b_enabled, type: int }, on_press: toggle_pwm_ch2_b_enabled, size: { w: 28, h: 18 }, bg: "#D0D0D0", color: "#D0D0D0", knob_off: "#FF0000", knob_on: "#00FF00" }
              - { kind: label, id: pwm_ch2_b_label, text: "B", font_size: medium, size: { w: 18, h: 18 } }
              - kind: row
                focus_ring: true   # duty: RE1 selects it, RE2 changes it 1 % per detent
                children:
                  - { kind: progress, id: pwm_ch2_b_duty, bind: { message: pwm, field: ch2_b_duty_percent, type: int }, range: { min: 0, max: 100 }, on_press: edit_pwm_ch2_b_duty, size: { w: 90, h: 14 } }
          - kind: row
            children:
              - kind: row
                focus_ring: true
                children:
                  - { kind: toggle, id: pwm_ch2_c_enabled_toggle, bind: { message: pwm, field: ch2_c_enabled, type: int }, on_press: toggle_pwm_ch2_c_enabled, size: { w: 28, h: 18 }, bg: "#D0D0D0", color: "#D0D0D0", knob_off: "#FF0000", knob_on: "#00FF00" }
              - { kind: label, id: pwm_ch2_c_label, text: "C", font_size: medium, size: { w: 18, h: 18 } }
              - kind: row
                focus_ring: true   # duty: RE1 selects it, RE2 changes it 1 % per detent
                children:
                  - { kind: progress, id: pwm_ch2_c_duty, bind: { message: pwm, field: ch2_c_duty_percent, type: int }, range: { min: 0, max: 100 }, on_press: edit_pwm_ch2_c_duty, size: { w: 90, h: 14 } }
      

  # ---- CH3 -- big row (fill -> 126px) --------------------------------
  - kind: row
    id: pwm_ch3_row
    fill: true
    children:
      - { kind: image, id: pwm_ch3_icon, file: "variable_multiple.jpg", size: { w: 126, h: 126 } }
      - { kind: image, id: pwm_ch2_icon, file: "variable_multiple_disabled.jpg", hidden: true, size: { w: 126, h: 126 }  }
      - kind: column
