# Janus app spec for the ArduinoIHM board (ATmega2560).
# Mirrors the real, currently-implemented GUI (lib/GUI/GUI.h, lib/Elements/
# TabSelector.h): three tabs in this exact order -- PWM, SERIAL, Output.
screens:
  - pwm.screen.yaml
  - bus_status.screen.yaml
  - relay.screen.yaml
nav:
  kind: tabs
  targets:
    - { screen: PWM, title: "PWM" }
    - { screen: BusStatus, title: "SERIAL" }
    - { screen: Relay, title: "Output" }
status:
  text: "Status: TBD"
display:
  size: { w: 320, h: 480 }
  background: "#000000"   # full-panel erase colour on tab switch (else widget bg, white)
  color: rgb565
  bus: parallel
input:
  modality: encoder
