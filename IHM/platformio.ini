; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
lib_compat_mode = off
monitor_speed = 250000
; Generated MAVLink C headers (mavlink/ihm_dialect.xml -> mavlink/generated/,
; regenerate with mavlink/generate.py). Not a lib/ subfolder because it's
; generated output, not hand-written source -- see mavlink/README.md.
; MAVLINK_MAX_PAYLOAD_LEN must be a global define (not a header #define)
; so it's set before mavlink.h is included from any translation unit --
; default is 255, which would cost ~280 bytes of this chip's 8KB RAM for
; the one shared parse buffer; our largest message is 38 bytes.
build_flags =
    -I mavlink/generated/ihm_dialect
    -D MAVLINK_MAX_PAYLOAD_LEN=64
